[common]
platform = espressif32@7.0.1
framework = arduino

[platformio]
; built when no environment is named (pio run)
; default_envs must live in this section and name an existing environment
default_envs = rev_6_ili9341
boards_dir = boards

; Library versions
; Every library is pinned: registry libraries to a version, GitHub libraries
; to the exact commit this firmware was last built and tested with. To update
; one, change its version or commit here on purpose and test the build.

[env]
extra_scripts =
  ; install the Python modules esptool needs (intelhex) when they are missing
  pre:script/esptool_deps.py
  ; skip these serial ports when auto-detecting the upload port
  pre:script/exclude_upload_ports.py
  ; name the build output after the FIRMWARE define instead of firmware.bin
  pre:script/firmware_name.py
custom_upload_port_exclude = COM17






; ------------------------------------------
; MICRO JOURNAL REVISION 4 with 68 Keyboard
; With Keypad
; ------------------------------------------
[env:rev_4_68]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1.5m
board = waveshare_rp2040_lcd_0_96

lib_deps =
  bblanchon/ArduinoJson@7.4.3
  https://github.com/Bodmer/TFT_eSPI#16e37595040eac69cd628e4bffb56fc30cad6299
  https://github.com/Bodmer/U8g2_for_TFT_eSPI#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
  https://github.com/adafruit/Adafruit_Keypad#379ee71e113ecbc98971fde1b0526d7fca1f8cde
  https://github.com/mathertel/RotaryEncoder.git#434dc95db50a520802d9d663a467bc788f76e5a8
  Adafruit TinyUSB Library
  https://github.com/bitbank2/AnimatedGIF#c2478eca7aa2f3b7a09bdc583e5a4a43d03ac0d9

build_src_filter =
  -<*>
  +<main.cpp>
  +<app/*>
  ;
  +<display/display.*>
  +<display/ST7735/*>
  ;
  +<keyboard/keyboard.*>
  +<keyboard/Keypad/Keypad.*>
  +<keyboard/Keypad/68/*>
  +<keyboard/Knob/*>
  +<keyboard/Locale/*>
  ;
  +<service/Tools/*>
  +<service/Editor/*>
  +<service/MassStorage/*>
  +<service/GIF/*>
  +<service/Battery/*>
  +<service/WordCounter/*>
  +<service/Send/*>
  +<service/Game/*>

lib_ignore =
  EPD
  EspUsbHost
  ESP32 BLE Keyboard
  FatFSUSB
  Keyboard
  HID_Keyboard
  LittleFS64

build_flags =
  ;
  ;-D DEBUG

  ; Device Configuration
  -D BOARD_PICO
  -D USE_TINYUSB
  -D KEYPAD_68
  -D KNOB
  -D USE_MSC ; mass storage
  -D BATTERY=27 ; battery level measuring pin
  -D GIF_BUFFER_SIZE=160 ; Optimum is >= GIF width or integral division of width

  ; Display Configuration
  -D USER_SETUP_LOADED=1
  -D ST7735_DRIVER=1
  -D ST7735_GREENTAB160x80=1
  -D TFT_MOSI=11     
  -D TFT_SCLK=10
  -D TFT_CS=9
  -D TFT_DC=8
  -D TFT_RST=12
  -D TFT_BL=25
  -D TFT_WIDTH=80
  -D TFT_HEIGHT=160
  -D TFT_INVERSION_ON
  -D RP2040_PIO_CLK_DIV=1
  -D TFT_SPI_PORT=1
  -D TOUCH_CS=-1
  -D SPI_FREQUENCY=27000000
  -D LOAD_GLCD
  -D SMOOTH_FONT










; ------------------------------------------
; MICRO JOURNAL REVISION 5
; With USBHOST
; ------------------------------------------
[env:rev_5_ili9341]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = dio_opi
board_build.arduino_psram = enabled
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 4128768
board_build.filesystem = littlefs
board_build.partitions = partition_esp32s3_rev8_16mb.csv
upload_speed =  921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

lib_deps = 
  bblanchon/ArduinoJson@7.4.3
  https://github.com/Bodmer/TFT_eSPI#16e37595040eac69cd628e4bffb56fc30cad6299
  https://github.com/Bodmer/U8g2_for_TFT_eSPI#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
  https://github.com/bitbank2/AnimatedGIF#c2478eca7aa2f3b7a09bdc583e5a4a43d03ac0d9
  https://github.com/h2zero/NimBLE-Arduino.git#2c487b78dd077dfbdfb1d7c44392e424a71ebb16
  https://github.com/LennartHennigs/Button2.git#2f8ba6ae471cb8b59c1d62ef6a3fbd5bedb8250e

build_src_filter = 
  -<*> 
  +<main.cpp>
  +<app/*>  
  ;
  +<display/display.*>
  +<display/ILI9341/*>
  ;
  +<keyboard/keyboard.*>
  +<keyboard/USBHost/*>
  +<keyboard/Button/*>
  +<keyboard/Locale/*>
  +<keyboard/BLE/*>
  ;
  +<service/Tools/*>
  +<service/Editor/*>
  +<service/Updater/*>
  +<service/WifiEntry/*>
  +<service/Buffer/*>
  +<service/Sync/*>
  +<service/FileServer/*>
  +<service/Menu/*>
  +<service/GIF/*>
  +<service/BLEServer/*>
  +<service/WordCounter/*>
  +<service/Send/*>
  +<service/Game/*>

lib_ignore = 
  FatFSUSB
  EPD
  USBHIDBoot
  
build_flags = 
  ;
  ;-D USE_SERIAL_KEYBOARD
  
  ; Configuration
  -D REV5
  -D USBHOST
  -D BOARD_ESP32_S3
  -D USE_BLESERVER
  -D USE_LITTLEFS
  -D BOARD_HAS_PSRAM
  -D GIF_BUFFER_SIZE=320
  -D FIRMWARE=\"/firmware_rev_5_ili9341.bin\"
  
  ; DISPLAY
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_RST=3
  -D LOAD_GLCD=1
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT
  -D GFXFF
  -D SPI_FREQUENCY=27000000
  -D TOUCH_CS=-1


  ; ESP32 S3
  -mfix-esp32-psram-cache-issue
  -DCONFIG_SPIRAM_CACHE_WORKAROUND
  -mfix-esp32-psram-cache-strategy=memw



; ------------------------------------------
; MICRO JOURNAL REVISION 5
; With USBHOST and ST7789 display
; ------------------------------------------
[env:rev_5_st7789]
extends = env:rev_5_ili9341
build_unflags =
  -D ILI9341_DRIVER=1
  -D FIRMWARE=\"/firmware_rev_5_ili9341.bin\"
build_flags =
  ${env:rev_5_ili9341.build_flags}
  -D FIRMWARE=\"/firmware_rev_5_st7789.bin\"
  -D ST7789_DRIVER=1
  -D TFT_INVERSION_OFF
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320







